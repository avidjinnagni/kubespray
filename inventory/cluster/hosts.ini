# ## Configure 'ip' variable to bind kubernetes services on a
# ## different ip than the default iface
# ## We should set etcd_member_name for etcd cluster. The node that is not a etcd member do not need to set the value, or can set the empty string value.
[all]
# master-1 ansible_host=172.16.10.21 ip=192.168.56.201 ansible_user=vagrant etcd_member_name=etcd1
#master-2 ansible_host=172.16.10.22 ip=192.168.56.202 ansible_user=vagrant etcd_member_name=etcd2
#worker-1 ansible_host=172.16.10.31 ip=192.168.56.211 ansible_user=vagrant etcd_member_name=etcd3
#worker-2 ansible_host=172.16.10.32 ip=192.168.56.212 ansible_user=vagrant

master-1 ansible_host=172.16.10.21 ip=172.16.10.21 ansible_user=vagrant etcd_member_name=etcd1
master-2 ansible_host=172.16.10.22 ip=172.16.10.22 ansible_user=vagrant etcd_member_name=etcd2
master-3 ansible_host=172.16.10.23 ip=172.16.10.23 ansible_user=vagrant etcd_member_name=etcd3
worker-1 ansible_host=172.16.10.31 ip=172.16.10.31 ansible_user=vagrant 
worker-2 ansible_host=172.16.10.32 ip=172.16.10.32 ansible_user=vagrant
worker-3 ansible_host=172.16.10.33 ip=172.16.10.33 ansible_user=vagrant
worker-4 ansible_host=172.16.10.34 ip=172.16.10.34 ansible_user=vagrant

# ## configure a bastion host if your nodes are not directly reachable
# [bastion]
# bastion ansible_host=x.x.x.x ansible_user=some_user

[kube_control_plane]
master-1
master-2
master-3

[etcd]
master-1
master-2
master-3

[kube_node]
worker-1
worker-2
worker-3
worker-4

[calico_rr]

[k8s_cluster:children]
kube_control_plane
kube_node
calico_rr